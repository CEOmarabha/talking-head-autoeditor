name = "autoeditor-web"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Static site (SPA)
[assets]
directory = "../site"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "autoeditor-web"
database_id = "28a0100d-7996-4d8d-b979-180086527c08"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "autoeditor-media"

# Secrets are already set in the Cloudflare dashboard and persist across
# deploys: KEY_WRAP_SECRET, WORKER_TOKEN, ADMIN_TOKEN. To rotate them:
#   npx wrangler secret put <NAME>
