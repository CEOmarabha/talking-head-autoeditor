name: Dispatch AutoEditor 0.1.3 acceptance build

on:
  push:
    branches: [work/windows-manifest-gate]
    paths: [.github/workflows/dispatch-autoeditor-013.yml]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Dispatch AutoEditor 0.1.3 acceptance build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start Windows x64 and Mac arm64 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run helper-release.yml --repo CEOmarabha/talking-head-autoeditor --ref work/windows-manifest-gate --field version=0.1.3
