name: Build AutoEditor Helper installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for an unsigned acceptance build
        required: true
        default: 0.1.0
  push:
    tags: ["helper-v*"]

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.2
  HYPERFRAMES_VERSION: 0.7.99
  HYPERFRAMES_CHROME_VERSION: 152.0.7928.2
  REMOTION_VERSION: 4.0.507
  WHISPER_SMALL_REVISION: 536b0662742c02347bc0e980a01041f333bce120
  WHISPER_MEDIUM_REVISION: 08e178d48790749d25932bbc082711ddcfdfbc4f

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target_os: windows
            arch: x64
            electron_target: win
          - os: macos-15
            target_os: mac
            arch: arm64
            electron_target: mac
          - os: macos-15-intel
            target_os: mac
            arch: x64
            electron_target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set native temporary artifact directory
        shell: bash
        run: echo "HELPER_DIST=$RUNNER_TEMP/helper-dist" >> "$GITHUB_ENV"

      - name: Resolve version and release policy
        id: release
        shell: bash
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#helper-v}"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="$MANUAL_VERSION"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
            echo "Invalid version: $VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=helper-${{ matrix.target_os }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Require a protected default-branch release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/helper-v')
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          test -n "$DEFAULT_BRANCH" || {
            echo "GitHub did not provide the repository default branch" >&2
            exit 1
          }
          test "$TAG_REF_PROTECTED" = true || {
            echo "The Helper release tag must be protected" >&2
            exit 1
          }
          TAG_COMMIT=$(git rev-parse HEAD)
          DEFAULT_COMMIT=$(git ls-remote --exit-code origin \
            "refs/heads/$DEFAULT_BRANCH" | awk 'NR == 1 {print $1}')
          [[ "$DEFAULT_COMMIT" =~ ^[a-f0-9]{40}$ ]] || {
            echo "Could not resolve the repository default-branch head" >&2
            exit 1
          }
          test "$TAG_COMMIT" = "$DEFAULT_COMMIT" || {
            echo "A Helper release tag must point to the protected default-branch head" >&2
            exit 1
          }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Freeze Python engine and render daemon
        shell: bash
        run: |
          LOCK="packaging/requirements-${{ matrix.target_os }}-${{ matrix.arch }}.txt"
          test -f "$LOCK"
          python -m pip --version
          python -m pip install --require-hashes -r "$LOCK"
          python -m pip check
          python -m unittest tests.test_safety
          python -m pytest -q webapp/tests/test_web.py
          pyinstaller packaging/engine.spec --distpath packaging/dist
          pyinstaller packaging/helper_daemon.spec --distpath packaging/dist
          ENGINE=packaging/dist/autoeditor-engine/autoeditor-engine
          DAEMON=packaging/dist/autoeditor-helper-daemon/autoeditor-helper-daemon
          if [[ "${{ matrix.target_os }}" == "windows" ]]; then
            ENGINE="${ENGINE}.exe"
            DAEMON="${DAEMON}.exe"
          fi
          "$ENGINE" --help >/dev/null
          "$ENGINE" --self-test
          test -x "$DAEMON" || test -f "$DAEMON"

      - name: Stage engine, models, profiles, fonts, certificates and notices
        shell: bash
        env:
          STAGE: desktop/helper-staging
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          rm -rf "$STAGE"
          mkdir -p "$STAGE"/{helper,engine,bin,lib,models,profiles,fonts,certs,licenses,node,browser,creative}
          cp -R packaging/dist/autoeditor-engine/. "$STAGE/engine/"
          cp -R packaging/dist/autoeditor-helper-daemon/. "$STAGE/helper/"
          HELPER_PROFILES=(
            generic_short
            generic_long
            generic_commercial
            generic_podcast
            generic_course
            generic_custom
          )
          for PROFILE in "${HELPER_PROFILES[@]}"; do
            test -f "profiles/$PROFILE/profile.yaml" || {
              echo "Missing required Helper profile: $PROFILE" >&2
              exit 1
            }
            cp -R "profiles/$PROFILE" "$STAGE/profiles/$PROFILE"
          done
          EXPECTED_PROFILES=$(printf '%s\n' "${HELPER_PROFILES[@]}" | LC_ALL=C sort)
          ACTUAL_PROFILES=$(find "$STAGE/profiles" -mindepth 1 -maxdepth 1 \
            -type d -exec basename {} \; | LC_ALL=C sort)
          [[ "$ACTUAL_PROFILES" == "$EXPECTED_PROFILES" ]] || {
            echo "Helper profile allowlist did not stage exactly" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' \
              "$EXPECTED_PROFILES" "$ACTUAL_PROFILES" >&2
            exit 1
          }
          cp packaging/THIRD_PARTY_NOTICES.md "$STAGE/licenses/THIRD_PARTY_NOTICES.md"
          LOCK="packaging/requirements-${TARGET_OS}-${TARGET_ARCH}.txt"
          cp "$LOCK" "$STAGE/licenses/PYTHON_REQUIREMENTS_LOCK.txt"
          python -m pip freeze --all > "$STAGE/licenses/PYTHON_PACKAGES.txt"
          pip-licenses --format=json --with-urls --with-license-file \
            > "$STAGE/licenses/PYTHON_LICENSES.json"
          python - <<'PY'
          import certifi, os, shutil
          shutil.copy2(certifi.where(), os.path.join(os.environ["STAGE"], "certs", "cacert.pem"))
          PY
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          stage = os.environ["STAGE"]
          snapshot_download(
              repo_id="Systran/faster-whisper-small",
              revision=os.environ["WHISPER_SMALL_REVISION"],
              local_dir=f"{stage}/models/faster-whisper-small",
          )
          snapshot_download(
              repo_id="Systran/faster-whisper-medium",
              revision=os.environ["WHISPER_MEDIUM_REVISION"],
              local_dir=f"{stage}/models/faster-whisper-medium",
          )
          PY
          FONTS_COMMIT=2d85e20401920891efb7cd6272d6339685df2820
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/$FONTS_COMMIT/ofl/montserrat/Montserrat%5Bwght%5D.ttf" \
            -o "$STAGE/fonts/Montserrat-Variable.ttf"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/$FONTS_COMMIT/ofl/worksans/WorkSans%5Bwght%5D.ttf" \
            -o "$STAGE/fonts/WorkSans-Variable.ttf"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/$FONTS_COMMIT/ofl/montserrat/OFL.txt" \
            -o "$STAGE/licenses/Montserrat-OFL.txt"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/$FONTS_COMMIT/ofl/worksans/OFL.txt" \
            -o "$STAGE/licenses/WorkSans-OFL.txt"
          test -s "$STAGE/models/faster-whisper-small/model.bin"
          test -s "$STAGE/models/faster-whisper-medium/model.bin"

      - name: Bundle FFmpeg and FFprobe on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ffmpeg
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew --version | head -n 1 | grep -Fx 'Homebrew 6.0.15'
          brew list --versions ffmpeg | grep -Eq '^ffmpeg 8\.1\.2_1([[:space:]]|$)' || {
            echo "Homebrew FFmpeg moved from audited formula revision 8.1.2_1. Review and repin before releasing." >&2
            exit 1
          }
          STAGE=desktop/helper-staging
          EXPECTED="packaging/macos-ffmpeg-formulae-${{ matrix.arch }}.txt"
          while IFS=' ' read -r FORMULA VERSION BOTTLE_TAG \
              BOTTLE_REBUILD BOTTLE_SHA EXTRA; do
            [[ -n "$FORMULA" && -n "$VERSION" && -n "$BOTTLE_TAG" ]]
            [[ -n "$BOTTLE_REBUILD" && -n "$BOTTLE_SHA" && -z "$EXTRA" ]]
            brew fetch --force "$FORMULA"
          done < "$EXPECTED"
          while IFS=' ' read -r FORMULA _; do
            [[ "$FORMULA" == "ffmpeg" ]] && continue
            brew reinstall --force-bottle "$FORMULA"
          done < "$EXPECTED"
          brew reinstall --force-bottle ffmpeg
          python packaging/verify_macos_ffmpeg_formulae.py \
            --ffmpeg "$(brew --prefix ffmpeg)/bin/ffmpeg" \
            --ffprobe "$(brew --prefix ffmpeg)/bin/ffprobe" \
            --cellar "$(brew --cellar)" \
            --expected "$EXPECTED" \
            --expected-arch "${{ matrix.arch }}" \
            --output "$STAGE/licenses/FFMPEG_FORMULAE.txt"
          python packaging/bundle_macos_ffmpeg.py \
            --ffmpeg "$(brew --prefix ffmpeg)/bin/ffmpeg" \
            --ffprobe "$(brew --prefix ffmpeg)/bin/ffprobe" \
            --bin-dir desktop/helper-staging/bin \
            --lib-dir desktop/helper-staging/lib
          while IFS=' ' read -r FORMULA VERSION BOTTLE_TAG \
              BOTTLE_REBUILD BOTTLE_SHA EXTRA; do
            [[ -n "$BOTTLE_TAG" && -n "$BOTTLE_REBUILD" ]]
            [[ -n "$BOTTLE_SHA" && -z "$EXTRA" ]]
            PREFIX=$(realpath "$(brew --prefix "$FORMULA")")
            [[ "$(basename "$PREFIX")" == "$VERSION" ]] || {
              echo "Installed $FORMULA prefix does not match $VERSION" >&2
              exit 1
            }
            DEST="$STAGE/licenses/ffmpeg-components/${FORMULA/@/_}-$VERSION"
            mkdir -p "$DEST"
            test -f "$PREFIX/INSTALL_RECEIPT.json"
            cp "$PREFIX/INSTALL_RECEIPT.json" "$DEST/"
            FORMULA_FILE=$(find "$PREFIX/.brew" -maxdepth 1 -type f \
              -name '*.rb' -print -quit)
            test -n "$FORMULA_FILE"
            cp "$FORMULA_FILE" "$DEST/"
            FOUND_LICENSE=0
            while IFS= read -r LICENSE_FILE; do
              cp "$LICENSE_FILE" "$DEST/"
              FOUND_LICENSE=1
            done < <(find "$PREFIX" -maxdepth 2 -type f \
              \( -iname 'COPYING*' -o -iname 'LICENSE*' \
                 -o -iname 'COPYRIGHT*' -o -iname 'NOTICE*' \) \
              -print | LC_ALL=C sort)
            [[ "$FOUND_LICENSE" == 1 ]] || {
              echo "No license text found for bundled formula $FORMULA" >&2
              exit 1
            }
          done < "$STAGE/licenses/FFMPEG_FORMULAE.txt"
          if otool -L desktop/helper-staging/bin/ffmpeg \
              desktop/helper-staging/bin/ffprobe desktop/helper-staging/lib/*.dylib | \
              grep -E '/opt/homebrew|/usr/local/(Cellar|opt)'; then
            echo "Homebrew path escaped the portable FFmpeg bundle" >&2
            exit 1
          fi

      - name: Bundle verified FFmpeg and FFprobe on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "ffmpeg-n8.1-latest-win64-gpl-8.1.zip"
          $release = Invoke-RestMethod `
            "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest"
          $metadata = $release.assets | Where-Object { $_.name -eq $asset }
          if (-not $metadata) { throw "Pinned FFmpeg release asset is missing" }
          Invoke-WebRequest $metadata.browser_download_url -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          $expected = "8e148d10ce8da1dca931c2f35c3a180100520bb48940f4bf1c0a3c1627467331"
          $published = $metadata.digest.Replace("sha256:", "").ToLower()
          if ($published -ne $expected) {
            throw "BtbN latest changed from the audited FFmpeg archive. Review and repin before releasing"
          }
          if ($actual -ne $expected) { throw "FFmpeg archive digest does not match the audited digest" }
          Expand-Archive ffmpeg.zip -DestinationPath fftmp
          Copy-Item "fftmp/*/bin/ffmpeg.exe" "desktop/helper-staging/bin/"
          Copy-Item "fftmp/*/bin/ffprobe.exe" "desktop/helper-staging/bin/"
          Copy-Item "fftmp/*/LICENSE.txt" `
            "desktop/helper-staging/licenses/FFMPEG-GPL-3.0.txt"
          Set-Content "desktop/helper-staging/licenses/FFMPEG_BUILD.txt" `
            "asset=$asset`nsha256=$actual`nbytes=$($metadata.size)`nrelease_id=$($release.id)`npublished_at=$($release.published_at)`nsource=$($metadata.browser_download_url)"

      - name: Verify required FFmpeg capabilities
        shell: bash
        run: |
          FFMPEG=desktop/helper-staging/bin/ffmpeg
          FFPROBE=desktop/helper-staging/bin/ffprobe
          [[ "${{ matrix.target_os }}" == "windows" ]] && FFMPEG="${FFMPEG}.exe" && FFPROBE="${FFPROBE}.exe"
          "$FFMPEG" -version | tee desktop/helper-staging/licenses/FFMPEG_VERSION.txt
          "$FFMPEG" -buildconf > desktop/helper-staging/licenses/FFMPEG_BUILDCONF.txt 2>&1
          "$FFPROBE" -version >/dev/null
          "$FFMPEG" -hide_banner -encoders 2>&1 | grep -q libx264
          "$FFMPEG" -hide_banner -encoders 2>&1 | grep -Eiq '(^| )aac( |$)'
          FILTERS=$($FFMPEG -hide_banner -filters 2>&1)
          for filter in fps aresample adelay atrim concat scale pad setsar overlay \
            chromakey despill alphaextract dilation erosion alphamerge \
            huesaturation loudnorm; do
            grep -Eq "[[:space:]]${filter}[[:space:]]" <<< "$FILTERS" || {
              echo "Required FFmpeg filter missing: $filter" >&2
              exit 1
            }
          done

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            packaging/helper-runtime/package-lock.json

      - name: Bundle pinned Node, HyperFrames, Remotion and rendering browser
        shell: bash
        env:
          STAGE: desktop/helper-staging
        run: |
          NODE_SOURCE=$(command -v node)
          cp "$NODE_SOURCE" "$STAGE/node/$(basename "$NODE_SOURCE")"
          if [[ "${{ matrix.target_os }}" == "windows" ]]; then
            NODE_ROOT=$(dirname "$NODE_SOURCE")
          else
            NODE_ROOT=$(dirname "$(dirname "$NODE_SOURCE")")
          fi
          test -f "$NODE_ROOT/LICENSE"
          cp "$NODE_ROOT/LICENSE" "$STAGE/licenses/Node-LICENSE.txt"
          test -f "$NODE_ROOT/README.md" && \
            cp "$NODE_ROOT/README.md" "$STAGE/licenses/Node-README.md" || true
          cp -R packaging/helper-runtime "$STAGE/creative-runtime"
          (cd "$STAGE/creative-runtime" && npm ci --omit=dev)
          (cd "$STAGE/creative-runtime" && npm audit --omit=dev --audit-level=high)
          (cd "$STAGE/creative-runtime" && npm ls --all --json \
            > "$OLDPWD/$STAGE/licenses/NPM_DEPENDENCIES.json")
          (cd "$STAGE/creative-runtime" && npm sbom --omit=dev \
            --sbom-format=cyclonedx \
            > "$OLDPWD/$STAGE/licenses/NPM_SBOM.cdx.json")
          cp packaging/helper-runtime/package-lock.json \
            "$STAGE/licenses/creative-runtime-package-lock.json"
          cp templates/remotion-viz/package-lock.json \
            "$STAGE/licenses/remotion-template-package-lock.json"
          cp -R templates/hyperframes-graphics "$STAGE/creative/hyperframes-graphics"
          mkdir -p "$STAGE/creative/hyperframes-graphics/vendor"
          cp "$STAGE/creative-runtime/node_modules/gsap/dist/gsap.min.js" \
            "$STAGE/creative/hyperframes-graphics/vendor/gsap.min.js"
          cp -R templates/remotion-viz "$STAGE/creative/remotion-viz"
          if [[ "${{ matrix.target_os }}" == "windows" ]]; then
            NODE=$(realpath "$STAGE/node/node.exe")
          else
            NODE=$(realpath "$STAGE/node/node")
          fi
          "$NODE" "$STAGE/creative-runtime/node_modules/hyperframes/bin/hyperframes.mjs" \
            browser ensure
          if [[ "${{ matrix.target_os }}" == "windows" ]]; then
            BROWSER=$(find "$HOME/.cache/hyperframes/chrome" -type f \
              -name chrome-headless-shell.exe | head -1)
            DEST=chrome-headless-shell-win64
          else
            BROWSER=$(find "$HOME/.cache/hyperframes/chrome" -type f \
              -name chrome-headless-shell | head -1)
            DEST=chrome-headless-shell-mac
          fi
          test -n "$BROWSER" && test -f "$BROWSER"
          cp -R "$(dirname "$BROWSER")" "$STAGE/browser/$DEST"

      - name: Render real HyperFrames and Remotion probes
        shell: bash
        env:
          STAGE: desktop/helper-staging
          HYPERFRAMES_NO_UPDATE_CHECK: "1"
          NODE_PATH: ${{ github.workspace }}/desktop/helper-staging/creative-runtime/node_modules
          REMOTION_LICENSE_KEY: free-license
        run: |
          NODE="$STAGE/node/node"
          FFMPEG="$STAGE/bin/ffmpeg"
          FFPROBE="$STAGE/bin/ffprobe"
          BROWSER="$STAGE/browser/chrome-headless-shell-mac/chrome-headless-shell"
          [[ "${{ matrix.target_os }}" == "windows" ]] && \
            NODE=$(realpath "$STAGE/node/node.exe") && FFMPEG="$STAGE/bin/ffmpeg.exe" && \
            FFPROBE="$STAGE/bin/ffprobe.exe" && \
            BROWSER="$STAGE/browser/chrome-headless-shell-win64/chrome-headless-shell.exe"
          export HYPERFRAMES_BROWSER_PATH="$BROWSER"
          export HYPERFRAMES_FFMPEG_PATH="$FFMPEG"
          export HYPERFRAMES_FFPROBE_PATH="$FFPROBE"
          "$NODE" "$STAGE/creative-runtime/node_modules/hyperframes/bin/hyperframes.mjs" \
            check --json "$STAGE/creative/hyperframes-graphics"
          (cd "$STAGE/creative/hyperframes-graphics" && \
            "$NODE" "$GITHUB_WORKSPACE/$STAGE/creative-runtime/node_modules/hyperframes/bin/hyperframes.mjs" \
              render -o "$RUNNER_TEMP/hyperframes-probe.mp4" --quality draft)
          "$NODE" "$STAGE/creative-runtime/node_modules/@remotion/cli/remotion-cli.js" \
            render "$STAGE/creative/remotion-viz/src/index.ts" FlowViz \
            "$RUNNER_TEMP/remotion-probe.mp4" \
            --props="$STAGE/creative/remotion-viz/probe-props.json" \
            --browser-executable="$BROWSER" --license-key="$REMOTION_LICENSE_KEY" \
            --public-dir="$STAGE/fonts" --bundle-cache=false --log=error
          "$FFPROBE" -v error -show_entries format=duration -of default=nw=1 \
            "$RUNNER_TEMP/hyperframes-probe.mp4"
          "$FFPROBE" -v error -show_entries format=duration -of default=nw=1 \
            "$RUNNER_TEMP/remotion-probe.mp4"
          if find "$STAGE" -type d -path '*/node_modules/.cache' \
              -print -quit | grep -q .; then
            echo "A writable Remotion cache leaked into the packaged creative project" >&2
            exit 1
          fi

      - name: Strip packaging metadata before writing receipts
        shell: bash
        run: |
          find desktop/helper-staging \
            \( -name '.DS_Store' -o -name '._*' \) -delete
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            xattr -cr desktop/helper-staging
          fi

      - name: Write exact runtime manifest
        shell: bash
        run: |
          python packaging/generate_helper_manifest.py \
            --stage desktop/helper-staging \
            --output desktop/helper-staging/runtime-manifest.json \
            --target-os "${{ matrix.target_os }}" \
            --target-arch "${{ matrix.arch }}" \
            --version "${{ steps.release.outputs.version }}"

      - name: Build installer
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci
          npm audit --audit-level=high
          npm version "${{ steps.release.outputs.version }}" \
            --no-git-tag-version --allow-same-version
          node --check helper/main.js
          node --check helper/preload.js
          node --check helper/renderer/app.js
          node --check scripts/notarize-artifacts.js
          npm test
          npx electron-builder --config electron-builder.helper.yml \
            --${{ matrix.electron_target }} \
            --${{ matrix.arch }} --publish never \
            --config.directories.output="$HELPER_DIST"

      - name: Verify the packed app ships the complete creative runtime
        shell: bash
        run: |
          # The 2026-08 Mac acceptance failed because electron-builder pruned
          # node_modules out of extraResources, so HyperFrames and Remotion
          # were missing from the actual DMG while every earlier stage passed.
          # This gate inspects the PACKED app, not the staging directory.
          if [[ "${{ matrix.target_os }}" == "windows" ]]; then
            RES=$(find "$HELPER_DIST" -maxdepth 2 -type d -name resources | head -1)
            NODE_BIN="$RES/node/node.exe"
            ENGINE_BIN="$RES/engine/autoeditor-engine.exe"
            DAEMON_BIN="$RES/helper/autoeditor-helper-daemon.exe"
          else
            APP=$(find "$HELPER_DIST" -maxdepth 3 -type d -name '*.app' | head -1)
            RES="$APP/Contents/Resources"
            NODE_BIN="$RES/node/node"
            ENGINE_BIN="$RES/engine/autoeditor-engine"
            DAEMON_BIN="$RES/helper/autoeditor-helper-daemon"
          fi
          test -n "$RES" && test -d "$RES" || { echo "Packed resources not found" >&2; exit 1; }
          for required in \
            "$RES/creative-runtime/node_modules/hyperframes/bin/hyperframes.mjs" \
            "$RES/creative-runtime/node_modules/@remotion/cli/remotion-cli.js" \
            "$RES/creative-runtime/package.json" \
            "$RES/creative/hyperframes-graphics/vendor/gsap.min.js" \
            "$RES/creative/remotion-viz/src/index.ts" \
            "$NODE_BIN" "$ENGINE_BIN" "$DAEMON_BIN" \
            "$RES/runtime-manifest.json"; do
            test -e "$required" || {
              echo "Packed app is missing: $required" >&2
              exit 1
            }
          done
          test -d "$RES/browser" && [ -n "$(ls -A "$RES/browser")" ] || {
            echo "Packed app is missing the rendering browser" >&2
            exit 1
          }
          python packaging/verify_helper_manifest.py --resources "$RES" \
            --expected-manifest desktop/helper-staging/runtime-manifest.json \
            --target-os "${{ matrix.target_os }}" \
            --target-arch "${{ matrix.arch }}" \
            --version "${{ steps.release.outputs.version }}"
          echo "Packed creative runtime is complete."

      - name: Smoke-test installed Windows app and signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:HELPER_DIST/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not created" }
          $run = Start-Process $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Installer exited $($run.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA "Programs/AutoEditor Helper"
          $app = Join-Path $root "AutoEditor Helper.exe"
          if (-not (Test-Path $app)) { throw "Installed Helper app is missing" }
          python packaging/verify_helper_manifest.py `
            --resources (Join-Path $root "resources") `
            --expected-manifest desktop/helper-staging/runtime-manifest.json `
            --target-os "${{ matrix.target_os }}" `
            --target-arch "${{ matrix.arch }}" `
            --version "${{ steps.release.outputs.version }}"
          $engine = Join-Path $root "resources/engine/autoeditor-engine.exe"
          if (-not (Test-Path $engine)) { throw "Installed frozen engine is missing" }
          & $engine --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed frozen engine self-test failed" }
          $screenshot = Join-Path $env:RUNNER_TEMP "helper-unsigned-windows-x64.png"
          Remove-Item $screenshot -Force -ErrorAction SilentlyContinue
          $env:AUTOEDITOR_SCREENSHOT_PATH = $screenshot
          $env:AUTOEDITOR_SCREENSHOT_SKIP_ACCOUNTS = "1"
          try {
            $capture = Start-Process $app -Wait -PassThru
          } finally {
            Remove-Item Env:AUTOEDITOR_SCREENSHOT_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:AUTOEDITOR_SCREENSHOT_SKIP_ACCOUNTS -ErrorAction SilentlyContinue
          }
          if ($capture.ExitCode -ne 0) { throw "Installed Helper screenshot launch failed" }
          if (-not (Test-Path $screenshot) -or (Get-Item $screenshot).Length -eq 0) {
            throw "Installed Helper screenshot is missing or empty"
          }
          Add-Type -AssemblyName System.Drawing
          $stream = [System.IO.File]::OpenRead($screenshot)
          try {
            $image = [System.Drawing.Image]::FromStream($stream, $false, $true)
            try {
              if ($image.RawFormat.Guid -ne [System.Drawing.Imaging.ImageFormat]::Png.Guid `
                  -or $image.Width -le 0 -or $image.Height -le 0) {
                throw "Installed Helper screenshot is not a decodable PNG"
              }
            } finally {
              $image.Dispose()
            }
          } finally {
            $stream.Dispose()
          }
          $env:AUTOEDITOR_SMOKE_TEST = "1"
          $smoke = Start-Process $app -Wait -PassThru
          Remove-Item Env:AUTOEDITOR_SMOKE_TEST
          if ($smoke.ExitCode -ne 0) { throw "Installed Helper smoke test failed" }
          $uninstaller = Join-Path $root "Uninstall AutoEditor Helper.exe"
          $remove = Start-Process $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path $app)) {
            throw "Windows uninstall smoke test failed"
          }

      - name: Smoke-test macOS app, DMG, signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find "$HELPER_DIST" -maxdepth 3 -type d -name '*.app' | head -1)
          DMG=$(find "$HELPER_DIST" -maxdepth 1 -type f -name '*.dmg' | head -1)
          test -n "$APP" && test -n "$DMG"
          # Never hardcode the binary name: resolve it from the bundle itself
          # (2026-08 acceptance found the workflow calling the wrong name).
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$APP/Contents/Info.plist")
          test -x "$APP/Contents/MacOS/$BIN" || {
            echo "Bundle executable $BIN is missing from $APP" >&2
            exit 1
          }
          AUTOEDITOR_SMOKE_TEST=1 "$APP/Contents/MacOS/$BIN"
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          # Verify the app AS FRIENDS RECEIVE IT: from a fresh DMG mount. This
          # catches Finder metadata attached after sealing, which passes on the
          # loose build directory but fails on the shipped artifact.
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -readonly -noautoopen
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          MOUNTED_APP=$(find "$MOUNT" -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$MOUNTED_APP"
          if xattr -lr "$MOUNTED_APP" 2>/dev/null | \
              grep -Eq 'com\.apple\.(FinderInfo|ResourceFork)'; then
            echo "Finder metadata is attached to the app inside the DMG" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$MOUNTED_APP"
          MOUNTED_BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$MOUNTED_APP/Contents/Info.plist")
          test -x "$MOUNTED_APP/Contents/MacOS/$MOUNTED_BIN"
          test -x "$MOUNTED_APP/Contents/Resources/engine/autoeditor-engine"
          "$MOUNTED_APP/Contents/Resources/engine/autoeditor-engine" --self-test
          SCREENSHOT="$RUNNER_TEMP/helper-unsigned-mac-${{ matrix.arch }}.png"
          AUTOEDITOR_SCREENSHOT_PATH="$SCREENSHOT" \
            AUTOEDITOR_SCREENSHOT_SKIP_ACCOUNTS=1 \
            "$MOUNTED_APP/Contents/MacOS/$MOUNTED_BIN"
          test -s "$SCREENSHOT"
          DECODED_SCREENSHOT="$RUNNER_TEMP/helper-unsigned-mac-${{ matrix.arch }}-decoded.png"
          /usr/bin/sips -s format png "$SCREENSHOT" \
            --out "$DECODED_SCREENSHOT" >/dev/null
          test -s "$DECODED_SCREENSHOT"
          WIDTH=$(/usr/bin/sips -g pixelWidth "$DECODED_SCREENSHOT" | \
            awk '/pixelWidth/ {print $2}')
          HEIGHT=$(/usr/bin/sips -g pixelHeight "$DECODED_SCREENSHOT" | \
            awk '/pixelHeight/ {print $2}')
          test "$WIDTH" -gt 0 && test "$HEIGHT" -gt 0
          AUTOEDITOR_SMOKE_TEST=1 "$MOUNTED_APP/Contents/MacOS/$MOUNTED_BIN"
          test -f "$MOUNTED_APP/Contents/Resources/creative-runtime/node_modules/hyperframes/bin/hyperframes.mjs"
          test -f "$MOUNTED_APP/Contents/Resources/creative-runtime/node_modules/@remotion/cli/remotion-cli.js"
          python packaging/verify_helper_manifest.py \
            --resources "$MOUNTED_APP/Contents/Resources" \
            --expected-manifest desktop/helper-staging/runtime-manifest.json \
            --target-os "${{ matrix.target_os }}" \
            --target-arch "${{ matrix.arch }}" \
            --version "${{ steps.release.outputs.version }}"
          hdiutil detach "$MOUNT" -force
          trap - EXIT

      - name: Seal prepared runtime for tag-only signing jobs
        if: steps.release.outputs.tagged == 'true'
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/helper-stage-${{ matrix.target_os }}-${{ matrix.arch }}.tar.gz" \
            -C desktop helper-staging

      - name: Upload prepared runtime to isolated signing job
        if: steps.release.outputs.tagged == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: prepared-${{ steps.release.outputs.artifact }}
          path: ${{ runner.temp }}/helper-stage-${{ matrix.target_os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Upload unsigned acceptance artifact
        if: steps.release.outputs.tagged != 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: |
            ${{ runner.temp }}/helper-dist/*.exe
            ${{ runner.temp }}/helper-dist/*.dmg
            ${{ runner.temp }}/helper-dist/*.blockmap
            desktop/helper-staging/runtime-manifest.json
          if-no-files-found: error

  sign-windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/helper-v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    environment: helper-windows-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set native temporary artifact directory
        shell: bash
        run: echo "HELPER_DIST=$RUNNER_TEMP/helper-signed-dist" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-helper-windows-x64
          path: ${{ runner.temp }}/prepared-helper

      - name: Restore the runtime that passed unsigned acceptance
        shell: bash
        run: |
          tar -xzf "$RUNNER_TEMP/prepared-helper/helper-stage-windows-x64.tar.gz" \
            -C desktop
          test -f desktop/helper-staging/runtime-manifest.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked packaging dependencies without signing credentials
        working-directory: desktop
        run: npm ci

      - name: Select the protected Windows signer
        id: signer
        shell: bash
        env:
          WIN_CERT: ${{ secrets.WIN_CSC_LINK }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CERT_THUMBPRINT: ${{ secrets.WIN_PFX_CERT_THUMBPRINT }}
          AZURE_TENANT_ID_VALUE: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID_VALUE: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET_VALUE: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_PUBLISHER: ${{ secrets.WIN_AZURE_PUBLISHER_NAME }}
          AZURE_ENDPOINT: ${{ secrets.WIN_AZURE_ENDPOINT }}
          AZURE_PROFILE: ${{ secrets.WIN_AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_ACCOUNT: ${{ secrets.WIN_AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_IDENTITY_EKU: ${{ secrets.WIN_AZURE_SUBSCRIBER_IDENTITY_EKU }}
        run: |
          if test -n "$AZURE_TENANT_ID_VALUE" && \
              test -n "$AZURE_CLIENT_ID_VALUE" && \
              test -n "$AZURE_CLIENT_SECRET_VALUE" && \
              test -n "$AZURE_PUBLISHER" && test -n "$AZURE_ENDPOINT" && \
              test -n "$AZURE_PROFILE" && test -n "$AZURE_ACCOUNT" && \
              test -n "$AZURE_IDENTITY_EKU"; then
            echo "kind=azure" >> "$GITHUB_OUTPUT"
          elif test -n "$WIN_CERT" && test -n "$WIN_CERT_PASSWORD" && \
              test -n "$WIN_CERT_THUMBPRINT"; then
            echo "kind=pfx" >> "$GITHUB_OUTPUT"
          else
            echo "A tagged Windows release requires complete Azure Artifact Signing secrets or WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD, and WIN_PFX_CERT_THUMBPRINT" >&2
            exit 1
          fi

      - name: Build the signed Windows installer with Azure
        if: steps.signer.outputs.kind == 'azure'
        shell: bash
        working-directory: desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WIN_AZURE_PUBLISHER_NAME: ${{ secrets.WIN_AZURE_PUBLISHER_NAME }}
          WIN_AZURE_ENDPOINT: ${{ secrets.WIN_AZURE_ENDPOINT }}
          WIN_AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.WIN_AZURE_CERTIFICATE_PROFILE_NAME }}
          WIN_AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.WIN_AZURE_CODE_SIGNING_ACCOUNT_NAME }}
        run: |
          VERSION="${GITHUB_REF_NAME#helper-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder --config electron-builder.helper.azure.js \
            --win --x64 --publish never \
            --config.directories.output="$HELPER_DIST"

      - name: Build the signed Windows installer with PFX
        if: steps.signer.outputs.kind == 'pfx'
        shell: bash
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          VERSION="${GITHUB_REF_NAME#helper-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder --config electron-builder.helper.yml \
            --win --x64 --publish never \
            --config.directories.output="$HELPER_DIST"

      - name: Verify installed Windows signatures and exact runtime
        shell: pwsh
        env:
          WINDOWS_SIGNER_KIND: ${{ steps.signer.outputs.kind }}
          WIN_PFX_CERT_THUMBPRINT: ${{ secrets.WIN_PFX_CERT_THUMBPRINT }}
          WIN_AZURE_SUBSCRIBER_IDENTITY_EKU: ${{ secrets.WIN_AZURE_SUBSCRIBER_IDENTITY_EKU }}
        run: |
          function Normalize-Thumbprint([string]$value) {
            return ($value -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          }
          function Get-EnhancedKeyUsageValues($certificate) {
            $extension = $certificate.Extensions | Where-Object {
              $_.Oid.Value -eq "2.5.29.37"
            } | Select-Object -First 1
            if (-not $extension) { return @() }
            $decoded = New-Object `
              System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension
            $decoded.CopyFrom($extension)
            return @($decoded.EnhancedKeyUsages | ForEach-Object { $_.Value })
          }
          function Assert-AuthenticodeSigner(
              [string]$file,
              [string]$expectedThumbprint,
              [string]$expectedIdentityEku) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne "Valid") {
              throw "$file signature is $($signature.Status)"
            }
            if (-not $signature.SignerCertificate) {
              throw "$file has no Authenticode signer certificate"
            }
            $actual = Normalize-Thumbprint $signature.SignerCertificate.Thumbprint
            if (-not $actual) { throw "$file signer thumbprint is empty" }
            if ($expectedThumbprint -and $actual -ne (Normalize-Thumbprint $expectedThumbprint)) {
              throw "$file signer thumbprint does not match the approved certificate"
            }
            $ekus = @(Get-EnhancedKeyUsageValues $signature.SignerCertificate)
            if ($ekus -notcontains "1.3.6.1.5.5.7.3.3") {
              throw "$file signer certificate lacks the code-signing EKU"
            }
            if ($expectedIdentityEku -and $ekus -notcontains $expectedIdentityEku) {
              throw "$file signer certificate lacks the approved Artifact Signing subscriber identity EKU"
            }
            return $actual
          }
          $installers = @(Get-ChildItem "$env:HELPER_DIST/*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one signed Windows installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          $approvedThumbprint = ""
          $approvedIdentityEku = ""
          if ($env:WINDOWS_SIGNER_KIND -eq "pfx") {
            $approvedThumbprint = Normalize-Thumbprint $env:WIN_PFX_CERT_THUMBPRINT
            if (-not $approvedThumbprint) {
              throw "WIN_PFX_CERT_THUMBPRINT is required for PFX signing"
            }
          } elseif ($env:WINDOWS_SIGNER_KIND -eq "azure") {
            $approvedIdentityEku = $env:WIN_AZURE_SUBSCRIBER_IDENTITY_EKU.Trim()
            if ($approvedIdentityEku -notmatch '^1\.3\.6\.1\.4\.1\.311\.97\.[0-9.]+$' `
                -or $approvedIdentityEku -eq "1.3.6.1.4.1.311.97.1.0") {
              throw "WIN_AZURE_SUBSCRIBER_IDENTITY_EKU is not a durable Artifact Signing identity OID"
            }
          } else {
            throw "Unknown protected Windows signer kind: $env:WINDOWS_SIGNER_KIND"
          }
          $installerThumbprint = Assert-AuthenticodeSigner `
            $installer.FullName $approvedThumbprint $approvedIdentityEku
          $install = Start-Process $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA "Programs/AutoEditor Helper"
          $app = Join-Path $root "AutoEditor Helper.exe"
          $uninstaller = Join-Path $root "Uninstall AutoEditor Helper.exe"
          foreach ($file in @($app, $uninstaller)) {
            if (-not (Test-Path $file)) { throw "Signed installed file is missing: $file" }
            $fileThumbprint = $installerThumbprint
            if ($env:WINDOWS_SIGNER_KIND -eq "azure") { $fileThumbprint = "" }
            [void](Assert-AuthenticodeSigner `
              $file $fileThumbprint $approvedIdentityEku)
          }
          python packaging/verify_helper_manifest.py `
            --resources (Join-Path $root "resources") `
            --expected-manifest desktop/helper-staging/runtime-manifest.json `
            --target-os windows --target-arch x64 `
            --version ($env:GITHUB_REF_NAME -replace '^helper-v', '')
          $engine = Join-Path $root "resources/engine/autoeditor-engine.exe"
          if (-not (Test-Path $engine)) { throw "Signed installed frozen engine is missing" }
          & $engine --self-test
          if ($LASTEXITCODE -ne 0) { throw "Signed installed frozen engine self-test failed" }
          $screenshot = Join-Path $env:RUNNER_TEMP "helper-signed-windows-x64.png"
          Remove-Item $screenshot -Force -ErrorAction SilentlyContinue
          $env:AUTOEDITOR_SCREENSHOT_PATH = $screenshot
          $env:AUTOEDITOR_SCREENSHOT_SKIP_ACCOUNTS = "1"
          try {
            $capture = Start-Process $app -Wait -PassThru
          } finally {
            Remove-Item Env:AUTOEDITOR_SCREENSHOT_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:AUTOEDITOR_SCREENSHOT_SKIP_ACCOUNTS -ErrorAction SilentlyContinue
          }
          if ($capture.ExitCode -ne 0) { throw "Signed installed Helper screenshot launch failed" }
          if (-not (Test-Path $screenshot) -or (Get-Item $screenshot).Length -eq 0) {
            throw "Signed installed Helper screenshot is missing or empty"
          }
          Add-Type -AssemblyName System.Drawing
          $stream = [System.IO.File]::OpenRead($screenshot)
          try {
            $image = [System.Drawing.Image]::FromStream($stream, $false, $true)
            try {
              if ($image.RawFormat.Guid -ne [System.Drawing.Imaging.ImageFormat]::Png.Guid `
                  -or $image.Width -le 0 -or $image.Height -le 0) {
                throw "Signed installed Helper screenshot is not a decodable PNG"
              }
            } finally {
              $image.Dispose()
            }
          } finally {
            $stream.Dispose()
          }
          $env:AUTOEDITOR_SMOKE_TEST = "1"
          $smoke = Start-Process $app -Wait -PassThru
          Remove-Item Env:AUTOEDITOR_SMOKE_TEST
          if ($smoke.ExitCode -ne 0) { throw "Installed Helper smoke test failed" }
          $remove = Start-Process $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path $app)) {
            throw "Windows uninstall smoke test failed"
          }

      - name: Upload the verified Windows candidate
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATE_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && \
            test -n "$R2_ACCOUNT_ID"
          INSTALLER=$(find "$HELPER_DIST" -maxdepth 1 -type f -name '*.exe' -print -quit)
          test -f "$INSTALLER"
          RECEIPT_DIR=release-receipt/helper-windows-x64
          mkdir -p "$RECEIPT_DIR"
          RECEIPT="$RECEIPT_DIR/candidate-windows-x64.json"
          python packaging/helper_release_metadata.py candidate \
            --file "$INSTALLER" \
            --runtime-manifest desktop/helper-staging/runtime-manifest.json \
            --target-os windows --arch x64 \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --signing-status verified --notarization-status not-applicable \
            --output "$RECEIPT"
          cp desktop/helper-staging/runtime-manifest.json \
            "$RECEIPT_DIR/runtime-manifest-windows-x64.json"
          KEY=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["key"])' "$RECEIPT")
          SHA=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RECEIPT")
          TYPE=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["content_type"])' "$RECEIPT")
          node desktop/scripts/r2-release-storage.js upload \
            --bucket autoeditor-release-candidates --key "$KEY" \
            --file "$INSTALLER" --content-type "$TYPE" --sha256 "$SHA"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-receipt-helper-windows-x64
          path: release-receipt/helper-windows-x64
          if-no-files-found: error

      - name: Upload the signed Windows candidate for physical acceptance
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: signed-candidate-helper-windows-x64
          path: |
            ${{ runner.temp }}/helper-signed-dist/*.exe
            release-receipt/helper-windows-x64
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign-macos:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/helper-v')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    environment: helper-macos-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set native temporary artifact directory
        shell: bash
        run: echo "HELPER_DIST=$RUNNER_TEMP/helper-signed-dist" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-helper-mac-${{ matrix.arch }}
          path: ${{ runner.temp }}/prepared-helper

      - name: Restore the runtime that passed unsigned acceptance
        shell: bash
        run: |
          tar -xzf "$RUNNER_TEMP/prepared-helper/helper-stage-mac-${{ matrix.arch }}.tar.gz" \
            -C desktop
          test -f desktop/helper-staging/runtime-manifest.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked packaging dependencies without signing credentials
        working-directory: desktop
        run: npm ci

      - name: Build the signed and notarized macOS installer
        shell: bash
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && \
            test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && \
            test -n "$APPLE_TEAM_ID" || {
            echo "A tagged Mac release requires Developer ID and notarization secrets" >&2
            exit 1
          }
          VERSION="${GITHUB_REF_NAME#helper-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder --config electron-builder.helper.yml \
            --mac --${{ matrix.arch }} --publish never \
            --config.directories.output="$HELPER_DIST"

      - name: Verify the final mounted Mac artifact
        shell: bash
        run: |
          DMG_COUNT=$(find "$HELPER_DIST" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          test "$DMG_COUNT" = 1
          DMG=$(find "$HELPER_DIST" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          hdiutil verify "$DMG"
          MOUNT=$(mktemp -d "$RUNNER_TEMP/helper-dmg.XXXXXX")
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -readonly -noautoopen
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          APP=$(find "$MOUNT" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          test -z "$(find "$APP" \( -name '.DS_Store' -o -name '._*' \) -print -quit)"
          if xattr -lr "$APP" 2>/dev/null | \
              grep -Eq 'com\.apple\.(FinderInfo|ResourceFork)'; then
            echo "Finder metadata is attached inside the signed app" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | \
            grep -q 'Authority=Developer ID Application'
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$APP/Contents/Info.plist")
          test -x "$APP/Contents/Resources/engine/autoeditor-engine"
          "$APP/Contents/Resources/engine/autoeditor-engine" --self-test
          SCREENSHOT="$RUNNER_TEMP/helper-signed-mac-${{ matrix.arch }}.png"
          AUTOEDITOR_SCREENSHOT_PATH="$SCREENSHOT" \
            AUTOEDITOR_SCREENSHOT_SKIP_ACCOUNTS=1 \
            "$APP/Contents/MacOS/$BIN"
          test -s "$SCREENSHOT"
          DECODED_SCREENSHOT="$RUNNER_TEMP/helper-signed-mac-${{ matrix.arch }}-decoded.png"
          /usr/bin/sips -s format png "$SCREENSHOT" \
            --out "$DECODED_SCREENSHOT" >/dev/null
          test -s "$DECODED_SCREENSHOT"
          WIDTH=$(/usr/bin/sips -g pixelWidth "$DECODED_SCREENSHOT" | \
            awk '/pixelWidth/ {print $2}')
          HEIGHT=$(/usr/bin/sips -g pixelHeight "$DECODED_SCREENSHOT" | \
            awk '/pixelHeight/ {print $2}')
          test "$WIDTH" -gt 0 && test "$HEIGHT" -gt 0
          AUTOEDITOR_SMOKE_TEST=1 "$APP/Contents/MacOS/$BIN"
          python packaging/verify_helper_manifest.py \
            --resources "$APP/Contents/Resources" \
            --expected-manifest desktop/helper-staging/runtime-manifest.json \
            --target-os mac --target-arch "${{ matrix.arch }}" \
            --version "${GITHUB_REF_NAME#helper-v}"
          hdiutil detach "$MOUNT" -force
          trap - EXIT

      - name: Upload the verified Mac candidate
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATE_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && \
            test -n "$R2_ACCOUNT_ID"
          INSTALLER=$(find "$HELPER_DIST" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -f "$INSTALLER"
          RECEIPT_DIR="release-receipt/helper-mac-${{ matrix.arch }}"
          mkdir -p "$RECEIPT_DIR"
          RECEIPT="$RECEIPT_DIR/candidate-mac-${{ matrix.arch }}.json"
          python packaging/helper_release_metadata.py candidate \
            --file "$INSTALLER" \
            --runtime-manifest desktop/helper-staging/runtime-manifest.json \
            --target-os mac --arch "${{ matrix.arch }}" \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --signing-status verified --notarization-status verified \
            --output "$RECEIPT"
          cp desktop/helper-staging/runtime-manifest.json \
            "$RECEIPT_DIR/runtime-manifest-mac-${{ matrix.arch }}.json"
          KEY=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["key"])' "$RECEIPT")
          SHA=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RECEIPT")
          TYPE=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["content_type"])' "$RECEIPT")
          node desktop/scripts/r2-release-storage.js upload \
            --bucket autoeditor-release-candidates --key "$KEY" \
            --file "$INSTALLER" --content-type "$TYPE" --sha256 "$SHA"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-receipt-helper-mac-${{ matrix.arch }}
          path: release-receipt/helper-mac-${{ matrix.arch }}
          if-no-files-found: error

      - name: Upload the signed Mac candidate for physical acceptance
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: signed-candidate-helper-mac-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/helper-signed-dist/*.dmg
            release-receipt/helper-mac-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
