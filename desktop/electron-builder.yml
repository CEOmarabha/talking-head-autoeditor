# Shared build config for both products. The PRODUCT env var (ryan | pse)
# selects identity; CI stamps product.json into resources so the runtime
# knows which product it is.
#
# Signing is OPTIONAL and env-gated:
#   mac: CSC_LINK/CSC_KEY_PASSWORD + APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/
#        APPLE_TEAM_ID  -> signed + notarized dmg
#   win: WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD -> signed installer
# Without those, CI produces ad-hoc or unsigned acceptance installers.

# Ryan is the safe local default. CI overrides these two fields for PSE with
# electron-builder's --config.* flags after it resolves the tag/product.
appId: com.marabha.ryanreels
productName: Ryan Reels Editor
directories:
  output: dist
  buildResources: build

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

files:
  - main.js
  - preload.js
  - product.js
  - lib/**
  - renderer/**

extraResources:
  - from: staging/product.json
    to: product.json
  - from: staging/engine
    to: engine
  - from: staging/bin
    to: bin
  - from: staging/lib
    to: lib
  - from: staging/profiles
    to: profiles
  - from: staging/fonts
    to: fonts
  # GPL binaries (FFmpeg/x264) are bundled below — ship their notices with
  # them. Corresponding-source obligation is tracked separately (owner).
  - from: staging/licenses
    to: licenses

publish:
  provider: github
  owner: CEOmarabha
  repo: talking-head-autoeditor
  channel: ryan

mac:
  category: public.app-category.video
  target:
    - target: dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false   # handled in afterSign hook only when creds exist

afterSign: scripts/notarize.js

win:
  target:
    - target: nsis

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
