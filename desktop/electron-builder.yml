# Legacy PSE desktop config. Friends use electron-builder.helper.yml and the
# generic AutoEditor Helper identity. CI stamps product.json into resources so
# the PSE runtime can verify its identity and packaged payload.
#
# Unsigned acceptance is built first. Signing credentials are injected only by
# tag-only, platform-specific jobs after that acceptance job passes.

# A local build must never default to a creator-specific friend identity.
appId: com.marabha.pseautoeditor
productName: PSE AutoEditor
directories:
  output: dist
  buildResources: build

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

files:
  - main.js
  - preload.js
  - product.js
  - lib/**
  - renderer/**

extraResources:
  - from: staging/product.json
    to: product.json
  - from: staging/engine
    to: engine
  - from: staging/bin
    to: bin
  - from: staging/lib
    to: lib
  - from: staging/profiles
    to: profiles
  - from: staging/fonts
    to: fonts
  # GPL binaries (FFmpeg/x264) are bundled below — ship their notices with
  # them. Corresponding-source obligation is tracked separately (owner).
  - from: staging/licenses
    to: licenses

mac:
  category: public.app-category.video
  target:
    - target: dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false   # handled in afterSign hook only when creds exist

dmg:
  writeUpdateInfo: false

afterSign: scripts/notarize.js

win:
  target:
    - target: nsis

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  differentialPackage: false
